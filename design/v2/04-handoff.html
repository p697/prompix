<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompix · Handoff tip</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F2F4}a:hover{color:#FFFFFF}
</style>
<style>body{margin:0;background:#2A2A2E;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px;box-sizing:border-box}</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0D; font-family: Manrope, system-ui, sans-serif; color: #F2F2F4;">
  <img src="assets/figurine.svg" alt="" style="position: absolute; left: -40px; top: -40px; width: 470px; height: 924px; object-fit: cover; filter: blur(18px) brightness(0.35);">
  <div style="position: absolute; left: 20px; right: 20px; top: 132px; background: #141418; border: 1px solid #26262C; border-radius: 24px; padding: 22px 20px 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    <span style="width: 52px; height: 52px; border-radius: 26px; background: #C8F560; color: #0B0B0D; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 23px; font-weight: 700;">Prompt copied</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #B4B4BC;">Gemini opens next. Paste the prompt into the message box, then add your photo.</p>
    </div>
    <div style="position: relative; height: 96px; border-radius: 16px; background: #0B0B0D; border: 1px solid #222228;">
      <span style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center;">
        <span style="font-size: 13px; font-weight: 800; padding: 6px 14px; border-radius: 10px; background: #F2F2F4; color: #0B0B0D;">Paste</span>
        <span style="width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 7px solid #F2F2F4;"></span>
      </span>
      <span style="position: absolute; left: 14px; right: 14px; bottom: 12px; height: 38px; border-radius: 19px; border: 1.5px solid #C8F560; background: #1C1C21; display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4B4BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span style="font-size: 13px; color: #9A9AA2;">Ask Gemini</span>
      </span>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
      <li style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D4D4DA;"><span style="width: 24px; height: 24px; border-radius: 12px; border: 1px solid #3A3A42; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none;">1</span>Tap the message box</li>
      <li style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D4D4DA;"><span style="width: 24px; height: 24px; border-radius: 12px; border: 1px solid #3A3A42; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none;">2</span>Tap Paste</li>
      <li style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D4D4DA;"><span style="width: 24px; height: 24px; border-radius: 12px; border: 1px solid #3A3A42; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none;">3</span>Add your photo with +</li>
    </ol>
    <a href="#" style="height: 50px; border-radius: 25px; background: #C8F560; color: #0B0B0D; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 16px; font-weight: 800;">Open Gemini<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="display: flex; align-items: center; gap: 8px;">
        <input id="v2h-hide" type="checkbox" style="width: 17px; height: 17px; accent-color: #C8F560; margin: 0;">
        <label for="v2h-hide" style="font-size: 13px; color: #B4B4BC;">Don't show this again</label>
      </span>
      <a href="#" style="font-size: 13px; font-weight: 700; color: #F2F2F4;">Get Gemini</a>
    </div>
  </div>
</div>
</body>
</html>
