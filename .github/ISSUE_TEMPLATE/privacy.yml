name: General privacy question / 一般隐私咨询
description: Ask about data handling without posting personal information.
title: "Privacy: "
body:
  - type: markdown
    attributes:
      value: "This is a public form. Describe your question in general terms only. If sensitive information is needed, ask for a private channel first. 此表单公开，请只描述一般性问题；敏感材料请先请求私下联系渠道。"
  - type: textarea
    id: question
    attributes:
      label: General question / 一般性问题
    validations:
      required: true
