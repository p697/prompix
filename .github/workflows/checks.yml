name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate -- ios/Prompix/Resources/catalog.json
      - name: Check scheduler retention safety
        run: python3 -m unittest discover -s scripts -p 'test_scheduler.py' -v
      - name: Check local release audit safety
        run: python3 -m unittest discover -s scripts -p 'test_release_audit.py' -v
      - name: Check complete interface localizations
        run: python3 scripts/check-localizations.py
      - name: Build public website
        run: |
          python3 services/site/build.py
          node --check services/site/site.js
  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and the iOS 27.1 SDK
        run: |
          xcodebuild -version
          PROMPIX_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if [[ "$PROMPIX_SIMULATOR_SDK" != "27.1" ]]; then
            echo "::error::Expected the iOS 27.1 simulator SDK, found $PROMPIX_SIMULATOR_SDK"
            exit 1
          fi
          echo "Using iOS simulator SDK $PROMPIX_SIMULATOR_SDK"
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test native models
        run: xcodebuild -project ios/Prompix.xcodeproj -scheme Prompix -destination "id=$DEVICE_ID" -only-testing:PrompixTests test CODE_SIGNING_ALLOWED=NO
