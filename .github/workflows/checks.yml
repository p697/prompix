name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate -- ios/Prompix/Resources/catalog.json
      - name: Check scheduler retention safety
        run: python3 -m unittest discover -s scripts -p 'test_scheduler.py' -v
      - name: Check complete interface localizations
        run: python3 scripts/check-localizations.py
      - name: Build public website
        run: |
          python3 services/site/build.py
          node --check services/site/site.js
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with the iOS 27.1 SDK
        run: |
          python3 - <<'PYCODE'
          import glob, os, subprocess
          choices = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              result = subprocess.run(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'],
                  env={**os.environ, 'DEVELOPER_DIR': developer}, capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(part) for part in result.stdout.strip().split('.'))
                  if version >= (27, 1):
                      choices.append((version, developer))
          if not choices:
              raise SystemExit('This build requires an Xcode installation containing the iOS 27.1 SDK.')
          version, developer = max(choices)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={developer}\n')
          print(f'Using {developer}, simulator SDK {version}')
          PYCODE
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test native models
        run: xcodebuild -project ios/Prompix.xcodeproj -scheme Prompix -destination "id=$DEVICE_ID" -only-testing:PrompixTests test CODE_SIGNING_ALLOWED=NO
