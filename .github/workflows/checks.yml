name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same pull request supersedes the running checks.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# `content` and `ios` are the required checks and stay under about two minutes:
# types, builds and data validation. The full test suites run beside them as
# `node-tests` and `ios-tests`; they report on every pull request but do not hold
# the merge. Nothing ships (deploy, release build) until they are green.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pull requests run only the checks their files can affect. Pushes to main,
      # and any doubt about the diff, run everything.
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] || ! files=$(git diff --name-only "$BASE...$HEAD") || [[ -z "$files" ]]; then
            printf 'node=true\nios=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          node=false; ios=false
          grep -qvE '^(docs|design|ios)/|\.md$' <<<"$files" && node=true
          grep -qE '^(ios|packages/schema|\.github/workflows)/' <<<"$files" && ios=true
          printf 'node=%s\nios=%s\n' "$node" "$ios" >> "$GITHUB_OUTPUT"
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete interface localizations
        run: python3 scripts/check-localizations.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Build database Feed Worker
        run: npx wrangler deploy --dry-run --config services/feed/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Build ingestion monitor Worker
        run: npx wrangler deploy --dry-run --config services/monitor/wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run validate -- ios/Prompix/Resources/catalog.json
      - name: Check scheduler retention safety
        run: python3 -m unittest discover -s scripts -p 'test_scheduler.py' -v
      - name: Check local release audit safety
        run: python3 -m unittest discover -s scripts -p 'test_release_audit.py' -v
      - name: Build public website
        run: |
          python3 services/site/build.py
          node --check services/site/site.js
  node-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.node == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  ios:
    needs: changes
    # A skipped job satisfies the required check, so run whenever the filter did not succeed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and the iOS 27.1 SDK
        run: |
          xcodebuild -version
          PROMPIX_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if [[ "$PROMPIX_SIMULATOR_SDK" != "27.1" ]]; then
            echo "::error::Expected the iOS 27.1 simulator SDK, found $PROMPIX_SIMULATOR_SDK"
            exit 1
          fi
      # Compiles the app and both test bundles without a simulator.
      - name: Build app and tests
        run: xcodebuild -project ios/Prompix.xcodeproj -scheme Prompix -destination 'generic/platform=iOS Simulator' build-for-testing CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
  ios-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      # A cold simulator takes minutes to boot; start it before anything else so
      # the boot overlaps the checkout and the build.
      - name: Boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; phones=[(("iOS-27-1" in r), d["udid"]) for r, ds in json.load(sys.stdin)["devices"].items() for d in ds if d["name"].startswith("iPhone")]; print(max(phones)[1])')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
      - uses: actions/checkout@v4
      - name: Build tests
        run: xcodebuild -project ios/Prompix.xcodeproj -scheme Prompix -destination "id=$DEVICE_ID" -only-testing:PrompixTests -derivedDataPath build build-for-testing CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Test native models
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/Prompix.xcodeproj -scheme Prompix -destination "id=$DEVICE_ID" -only-testing:PrompixTests -derivedDataPath build test-without-building CODE_SIGNING_ALLOWED=NO
